<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تحلیل طلا</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@5.0.6/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{--bg:#0e1013;--card:#161a1f;--line:#252b33;--tx:#e8eaed;--mut:#8b949e;--gold:#d4af37;--up:#26a69a;--dn:#ef5350}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font:14px/1.7 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding:14px 12px 40px;max-width:640px;margin:auto}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
h1{font-size:15px;font-weight:600;color:var(--gold)}
.price{font:600 22px/1.2 ui-monospace,Menlo,monospace;direction:ltr;text-align:right;transition:color .25s}
.price.u{color:var(--up)}.price.d{color:var(--dn)}
#dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#555;margin-right:7px;vertical-align:middle}#dot.ok{background:var(--up)}#dot.bad{background:var(--dn)}
.chip{display:inline-block;padding:1px 10px;border-radius:99px;font-size:12px;border:1px solid var(--line);color:var(--mut)}
.chip.up{color:var(--up);border-color:#1f5a41}.chip.dn{color:var(--dn);border-color:#6a2b2b}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;margin:10px 0}
.seg button{flex:1;background:none;border:0;color:var(--mut);padding:6px 2px;border-radius:8px;font:inherit;font-size:11.5px;line-height:1.4;cursor:pointer}
.seg button.on{background:#222831;color:var(--tx)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.card h2{font-size:12px;font-weight:500;color:var(--mut);margin-bottom:8px}
.chart{padding:0;overflow:hidden}
.cwrap{position:relative;direction:ltr;height:min(60vh,470px);min-height:340px}
#cv{position:absolute;inset:0}
#ohlc{position:absolute;z-index:3;top:4px;left:6px;width:fit-content;max-width:calc(100% - 68px);background:rgba(22,26,31,.78);padding:1px 6px;border-radius:6px;font:10px/1.35 ui-monospace,Menlo,monospace;color:var(--mut);pointer-events:none}#ohlc b{color:var(--tx);font-weight:500}
#jump{position:absolute;z-index:3;bottom:26px;right:64px;background:#222831;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:2px 10px;font-size:12px;cursor:pointer;display:none}
.layers{display:flex;gap:6px;padding:8px 10px;direction:ltr;border-top:1px solid var(--line);flex-wrap:wrap}
.layers b{font:600 11px ui-monospace,monospace;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--mut);cursor:pointer}
.layers b.on{color:var(--gold);background:#2a2410;border-color:#5a4a14}
.layers select{background:#161a1f;color:var(--mut);border:1px solid var(--line);border-radius:99px;font:600 11px ui-monospace,monospace;padding:1px 6px;margin-left:auto}
.layers span{font-size:10.5px;color:var(--mut)}
.setup{border-top:1px solid var(--line);padding:10px 0}.setup:first-of-type{border:0;padding-top:0}
.row{display:flex;align-items:center;gap:8px}
.grade{font-weight:700;padding:0 8px;border-radius:6px;background:#2a2410;color:var(--gold)}.grade.c{background:#222;color:var(--mut)}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0;direction:ltr;text-align:center;font:12px ui-monospace,Menlo,monospace}
.nums div{background:#11151a;border-radius:8px;padding:4px 0}.nums small{display:block;color:var(--mut);font-size:10px}
.why{font-size:12px;color:var(--mut)}
button.main{width:100%;background:var(--gold);color:#1a1500;border:0;border-radius:12px;padding:11px;font-weight:600;font-size:14px;font-family:inherit;cursor:pointer}
button.main:disabled{opacity:.5}
.ai{white-space:pre-wrap;font-size:13px}
.err{color:var(--dn);font-size:12px;margin:6px 0}
.hist{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line);font-size:12px;color:var(--mut);cursor:pointer}.hist:first-of-type{border:0}
.foot{text-align:center;font-size:11px;color:var(--mut);margin-top:18px}
</style>
</head>
<body>
<header>
  <div><h1>XAUUSD · تحلیل ساختار</h1><span id="bias" class="chip">…</span> <span id="kz" class="chip" hidden></span></div>
  <div class="price"><span id="price">—</span><i id="dot"></i></div>
</header>

<div class="seg" id="mode">
  <button data-m="fast">فست<br>H1→M5→M1</button><button data-m="scalp" class="on">اسکالپ<br>H4→H1→M15</button><button data-m="swing">سوئینگ<br>D1→H4→H1</button>
</div>
<div class="seg" id="tabs"></div>

<div class="card chart">
  <div class="cwrap"><div id="cv"></div><div id="ohlc"></div><button id="jump">⇥ آخرین کندل</button></div>
  <div class="layers" id="lay"><b data-l="ob" class="on">OB</b><b data-l="fvg" class="on">FVG</b><b data-l="liq" class="on">LIQ</b><b data-l="st" class="on">BOS/CHoCH</b><select id="tz"><option value="UTC">UTC</option><option value="Asia/Tehran">Tehran</option><option value="America/New_York">New York</option><option value="Europe/London">London</option><option value="">Local</option></select><span id="src"></span></div>
</div>

<div class="card"><h2>بهترین ستاپ‌ها (امتیاز کانفلوئنس)</h2><div id="setups"></div></div>
<div class="card"><h2>روایت تحلیل</h2><div id="ai" class="ai" style="color:var(--mut)">—</div>
  <button class="main" id="aiBtn" style="margin-top:10px" hidden>تولید روایت با هوش مصنوعی</button></div>

<button class="main" id="go">تحلیل جدید</button>
<div id="err" class="err"></div>
<div class="card" style="margin-top:14px"><h2>تحلیل‌های قبلی</h2><div id="hist"></div></div>
<div class="foot">تشخیص‌ها الگوریتمی‌ان و ممکنه چند پیپ با چارت بروکر تو فرق کنن.<br>آموزشی است؛ توصیه‌ی معاملاتی نیست.</div>

<script>
const tg = window.Telegram && Telegram.WebApp; if (tg) { tg.ready(); tg.expand(); try { tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {} }
const $ = s => document.querySelector(s);
const KEY = new URLSearchParams(location.search).get("key") || "";
async function api(p, m = "GET", b) {
  const r = await fetch("/api/" + p, {method: m, headers: {"Content-Type": "application/json", "X-Init-Data": tg ? tg.initData : "", "X-Admin-Key": KEY}, body: b ? JSON.stringify(b) : undefined});
  const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || r.status); return j;
}
const SEC = {M1: 60, M5: 300, M15: 900, H1: 3600, H4: 14400, D1: 86400}, ROLE = ["بایاس", "ناحیه", "ورود"];
let mode = "scalp", cur = null, tf = null, aid = null, aiOn = false, loadedTf = null, loadedSrc = null;

/* ══════════════ موتور چارت: TradingView Lightweight Charts + اوورلی SMC ══════════════ */
const LW = LightweightCharts, UP = "#26a69a", DN = "#ef5350";
let C = [], TZ = "Asia/Tehran"; try { TZ = localStorage.getItem("tz") ?? TZ; } catch (e) {}
const layers = {ob: 1, fvg: 1, liq: 1, st: 1}, p2 = n => String(n).padStart(2, "0");
const fdt = (t, o) => new Intl.DateTimeFormat("en-GB", {timeZone: TZ || undefined, hour12: false, ...o}).format(new Date(t * 1000));
const fmt = (t, full) => fdt(t, full ? {day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"} : {hour: "2-digit", minute: "2-digit"});
const chart = LW.createChart($("#cv"), {
  autoSize: true,
  layout: {background: {type: "solid", color: "#161a1f"}, textColor: "#8b949e", fontSize: 11, fontFamily: "ui-monospace,Menlo,monospace"},
  grid: {vertLines: {color: "#1c2128"}, horzLines: {color: "#1c2128"}},
  crosshair: {mode: 0, vertLine: {color: "#6b7480", labelBackgroundColor: "#363c46"}, horzLine: {color: "#6b7480", labelBackgroundColor: "#363c46"}},
  rightPriceScale: {borderColor: "#252b33", scaleMargins: {top: .1, bottom: .1}},
  timeScale: {borderColor: "#252b33", timeVisible: true, secondsVisible: false, rightOffset: 8, barSpacing: 8, minBarSpacing: 1.5},
  handleScroll: {vertTouchDrag: false}, kineticScroll: {touch: true, mouse: false}
});
const series = chart.addSeries(LW.CandlestickSeries, {upColor: UP, downColor: DN, borderUpColor: UP, borderDownColor: DN, wickUpColor: UP, wickDownColor: DN,
  priceFormat: {type: "price", precision: 2, minMove: .01}, priceLineColor: "#d4af37"});
function tzOpts() {
  chart.applyOptions({localization: {timeFormatter: t => fmt(t, true)},
    timeScale: {tickMarkFormatter: (t, ty) => ty >= 3 ? fmt(t) : ty === 2 ? fdt(t, {day: "numeric", month: "short"}) : ty === 1 ? fdt(t, {month: "short"}) : fdt(t, {year: "numeric"})}});
}
$("#tz").value = TZ; $("#tz").onchange = e => { TZ = e.target.value; try { localStorage.setItem("tz", TZ); } catch (x) {} tzOpts(); legend(); };
tzOpts();

/* اوورلی OB / FVG / لیکوییدیتی / BOS-CHoCH: روی خود چارت (بر پایه‌ی زمان و قیمت) کشیده می‌شه، پس با پن و زوم دقیقاً می‌چسبه */
class Overlay {
  attached(p) { this.req = p.requestUpdate; }
  updateAllViews() {}
  paneViews() { return [{zOrder: () => "bottom", renderer: () => ({draw: t => this.draw(t)})}]; }
  draw(target) {
    target.useBitmapCoordinateSpace(({context: x, mediaSize: ms, horizontalPixelRatio: hr, verticalPixelRatio: vr}) => {
      const ov = cur && cur.charts && cur.charts[loadedTf]; if (!ov || !C.length) return;
      const ts = chart.timeScale(), bs = ts.options().barSpacing, W = ms.width, used = [], t0 = C[0][0], T = v => v > 1e9;
      const Y = p => series.priceToCoordinate(p), XT = t => { const v = ts.timeToCoordinate(t); return v == null ? (t < t0 ? -20 : null) : v; };
      x.save(); x.scale(hr, vr); x.font = "10px ui-monospace,Menlo,monospace"; x.textBaseline = "middle"; x.lineWidth = 1;
      const lab = (txt, y, dir, col) => { for (let k = 0; k < 8 && used.some(u => Math.abs(u - y) < 11); k++) y += dir * 11; used.push(y); x.fillStyle = col; x.textAlign = "right"; x.fillText(txt, W - 4, y); };
      const line = (xa, xb, y, col) => { x.strokeStyle = col; x.beginPath(); x.moveTo(xa, y); x.lineTo(xb, y); x.stroke(); };
      const zone = (t, lo, hi, fill, ln, label) => {
        const xa = XT(t), y0 = Y(hi), y1 = Y(lo); if (xa == null || y0 == null || y1 == null) return;
        const x0 = xa - bs / 2, h = Math.max(1, y1 - y0); if (x0 > W) return;
        x.fillStyle = fill; x.fillRect(x0, y0, W - x0, h); line(x0, W, y0, ln); line(x0, W, y0 + h, ln); if (label && h > 11) lab(label, y0 + 7, 1, ln);
      };
      if (layers.fvg) ov.fvg.filter(g => T(g.t)).slice(-3).forEach(g => zone(g.t, g.lo, g.hi, "rgba(91,156,245,.13)", "rgba(91,156,245,.45)", "FVG"));
      if (layers.ob) ov.ob.filter(o => T(o.t)).forEach(o => zone(o.t, o.lo, o.hi, o.d > 0 ? "rgba(38,166,154,.2)" : "rgba(239,83,80,.2)", o.d > 0 ? "rgba(38,166,154,.8)" : "rgba(239,83,80,.8)", (o.d > 0 ? "OB▲" : "OB▼") + (o.st === "tested" ? " T" : "")));
      x.setLineDash([5, 4]);
      if (layers.liq) ov.liq.filter(l => T(l.t) && l.st !== "swept").forEach(l => { const xa = XT(l.t), y = Y(l.p); if (xa == null || y == null) return; line(Math.max(0, xa), W, y, "#d4af37"); lab(l.k === "H" ? "EQH" : "EQL", y - 6, -1, "#d4af37"); });
      if (layers.st) ov.ev.filter(e => T(e.a)).forEach(e => {
        const xa = XT(e.a), xb = XT(e.b), y = Y(e.lvl); if (xa == null || xb == null || y == null || xb < 0 || xa > W || xb - xa < 20) return;
        const col = e.d > 0 ? UP : DN; line(Math.max(0, xa), xb, y, col);
        if (xb - xa > 34) { x.fillStyle = col; x.textAlign = "center"; x.fillText(e.t, (Math.max(0, xa) + xb) / 2, y + (e.d > 0 ? -7 : 8)); }
      });
      if (ov.pd) { const y = Y(ov.pd.eq); if (y != null) { line(0, W, y, "#6b7480"); lab("EQ", y - 6, -1, "#6b7480"); } }
      x.restore();
    });
  }
}
const ovl = new Overlay(); series.attachPrimitive(ovl);
const req = () => ovl.req && ovl.req();

const bar = k => ({time: k[0], open: k[1], high: k[2], low: k[3], close: k[4]});
function legend(k) {
  k = k || C[C.length - 1]; if (!k) return; const chg = (k[4] - k[1]) / k[1] * 100;
  $("#ohlc").innerHTML = `${fmt(k[0], true)} &nbsp;O <b>${k[1].toFixed(2)}</b> H <b>${k[2].toFixed(2)}</b> L <b>${k[3].toFixed(2)}</b> C <b>${k[4].toFixed(2)}</b> <span style="color:${chg >= 0 ? UP : DN}">${chg >= 0 ? "+" : ""}${chg.toFixed(2)}%</span>`;
}
chart.subscribeCrosshairMove(p => { const d = p.time && p.seriesData.get(series); legend(d ? [p.time, d.open, d.high, d.low, d.close] : null); });
chart.timeScale().subscribeVisibleLogicalRangeChange(r => { $("#jump").style.display = r && C.length && r.to < C.length - 3 ? "block" : "none"; });
function feed() { C = C.filter((k, i) => !i || k[0] > C[i - 1][0]); series.setData(C.map(bar)); legend(); }
function tick(k) {                              // آپدیت زنده‌ی کندل آخر / کندل جدید؛ بدون دست زدن به بقیه
  const n = C.length - 1; if (n < 0 || k[0] < C[n][0]) return;
  if (k[0] === C[n][0]) C[n] = k; else C.push(k); series.update(bar(k)); legend();
}
function resetView() {
  chart.priceScale("right").applyOptions({autoScale: true});
  chart.timeScale().applyOptions({barSpacing: SEC[loadedTf] <= 300 ? 7 : 9}); chart.timeScale().scrollToPosition(8, false);
}
$("#jump").onclick = resetView;

/* ══════════════ دیتا: بارگذاری + آپدیت زنده ══════════════ */
const setDot = c => $("#dot").className = c;
function setPrice() {
  const p = C[C.length - 1][4], el = $("#price"), old = parseFloat(el.textContent);
  el.textContent = p.toFixed(2); if (old && old !== p) { el.className = p > old ? "u" : "d"; setTimeout(() => el.className = "", 350); }
}
async function loadTF(t) {
  const j = await api(`candles?tf=${t}&limit=2500`); if (t !== tf) return;
  C = j.c; loadedTf = t; loadedSrc = j.src; srcLabel(j); feed(); setPrice(); resetView(); setDot("ok");
}
function srcLabel(j) {
  const stale = j.age != null && !j.closed && j.age > 4 * SEC[loadedTf] + 120;
  $("#src").textContent = (["dukascopy", "oanda", "twelve"].includes(j.src) ? "" : "⚠ ") + (j.src || "") + (stale ? " · ⚠ " + Math.round(j.age / 60) + "د عقب" : "") + (j.cr != null ? " · " + j.cr + "/800" : "");
}
let busy = false;
async function poll() {
  if (document.hidden || !C.length || busy || loadedTf !== tf) return; busy = true; const t0 = tf;
  try {
    const j = await api(`candles?tf=${t0}&since=${C[Math.max(0, C.length - 90)][0]}`); if (t0 !== tf) return;
    if (j.src !== loadedSrc) { loadedSrc = j.src; await loadTF(t0); busy = false; return; }   // منبع عوض شده ← قیمت‌ها هم‌سطح نیستن، کل دیتا رو دوباره بگیر
    srcLabel(j);
    j.c.forEach(tick);
    setPrice(); setDot("ok"); req();
  } catch (e) { setDot("bad"); }
  busy = false;
}
setInterval(poll, 2500);

/* ══════════════ UI و تحلیل ══════════════ */
function setMode(m) { mode = m; document.querySelectorAll("#mode button").forEach(b => b.classList.toggle("on", b.dataset.m === m)); }
function tabs() { $("#tabs").innerHTML = cur.tfs.map((t, i) => `<button data-t="${t}" class="${t === tf ? "on" : ""}">${t} ${ROLE[i]}</button>`).join(""); }
$("#mode").onclick = e => { if (e.target.dataset.m) { setMode(e.target.dataset.m); tf = null; run(); } };
$("#tabs").onclick = e => { const t = e.target.dataset.t; if (t && t !== tf) { tf = t; tabs(); loadTF(t).catch(x => $("#err").textContent = x.message); } };
$("#lay").onclick = e => { const l = e.target.dataset.l; if (l) { layers[l] ^= 1; e.target.classList.toggle("on", !!layers[l]); req(); } };
$("#go").onclick = () => run(); $("#aiBtn").onclick = narrate;

function setups(res) {
  $("#setups").innerHTML = res.setups.length ? res.setups.map(s => `<div class="setup">
    <div class="row"><span class="grade ${s.grade === "C" ? "c" : ""}">${s.grade}</span><b style="color:var(--${s.d > 0 ? "up" : "dn"})">${s.d > 0 ? "خرید" : "فروش"}</b>
    <span style="color:var(--mut);font-size:12px">OB ${s.tf} · ${s.lo}–${s.hi}${s.inzone ? " · داخل ناحیه" : ""}</span></div>
    <div class="nums"><div><small>ENTRY</small>${s.entry}</div><div><small>SL</small>${s.sl}</div><div><small>TP</small>${s.tp ?? "—"}</div><div><small>RR</small>${s.rr ?? "—"}</div></div>
    <div class="why">${s.why.join(" · ") || "—"}</div></div>`).join("") : '<div class="why">ستاپ معتبری الان نیست.</div>';
}
function head(res) {
  const b = $("#bias"); b.className = "chip " + (res.bias > 0 ? "up" : res.bias < 0 ? "dn" : "");
  b.textContent = (res.bias > 0 ? "صعودی" : res.bias < 0 ? "نزولی" : "نامشخص") + " · " + res.tfs[0];
  $("#kz").hidden = !res.kz; $("#kz").textContent = "کیلزون " + (res.kz || "");
}
async function render(res, id, ai) {
  cur = res; aid = id; setMode(res.mode); if (!res.tfs.includes(tf)) tf = res.tfs[2];
  head(res); tabs(); setups(res);
  $("#ai").textContent = ai || "—"; $("#ai").style.color = ai ? "var(--tx)" : "var(--mut)"; $("#aiBtn").hidden = !aiOn || !!ai || !id;
  if (loadedTf !== tf || !C.length) await loadTF(tf); else req();
}
async function run() {
  $("#go").disabled = true; $("#err").textContent = ""; $("#go").textContent = "در حال تحلیل…";
  try { const j = await api("analyze", "POST", {mode}); await render(j.res, j.id, null); loadHist(); }
  catch (e) { $("#err").textContent = e.message; }
  $("#go").disabled = false; $("#go").textContent = "تحلیل جدید";
}
setInterval(async () => {                      // رفرش خودکار اوورلی‌ها و ستاپ‌ها (ذخیره نمی‌شه)
  if (document.hidden || !cur || !cur.mode) return;
  try { const j = await api("analyze", "POST", {mode: cur.mode, live: true}); if (j.res.mode === mode) { cur = j.res; head(cur); setups(cur); req(); } } catch (e) {}
}, 60000);
async function narrate() {
  $("#aiBtn").disabled = true; $("#aiBtn").textContent = "در حال نوشتن…";
  try { const j = await api(`analyses/${aid}/narrate`, "POST"); $("#ai").textContent = j.text; $("#ai").style.color = "var(--tx)"; $("#aiBtn").hidden = true; }
  catch (e) { $("#err").textContent = e.message; }
  $("#aiBtn").disabled = false; $("#aiBtn").textContent = "تولید روایت با هوش مصنوعی";
}
async function openOld(id) { try { const j = await api("analyses/" + id); await render(j.res, id, j.ai); scrollTo({top: 0, behavior: "smooth"}); } catch (e) { $("#err").textContent = e.message; } }
function loadHist() {
  api("me").then(j => { aiOn = j.ai; $("#hist").innerHTML = j.history.map(h => `<div class="hist" onclick="openOld('${h.id}')">
    <span>${new Date(h.t).toLocaleString("fa-IR", {dateStyle: "short", timeStyle: "short"})} · ${{fast: "فست", scalp: "اسکالپ", swing: "سوئینگ"}[h.mode] || h.mode}</span>
    <span style="direction:ltr">${h.price} ${h.grade ? "· " + h.grade : ""}</span></div>`).join("") || '<div class="why">هنوز تحلیلی نداری.</div>'; }).catch(() => {});
}
api("me").then(j => { aiOn = j.ai; setMode(j.mode); run(); }).catch(e => $("#err").textContent = e.message);
</script>
</body>
</html>
